[project]
name = "restaurant-aeo"
version = "0.1.0"
description = "AEO/GEO measurement toolkit: track how often a local restaurant appears in LLM answers (ChatGPT, Claude, Gemini, Perplexity), then optimize and re-measure."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.92.0",
    "openai>=1.60.0",
    "google-generativeai>=0.8.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "rapidfuzz>=3.9.0",
    "tenacity>=9.0.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
