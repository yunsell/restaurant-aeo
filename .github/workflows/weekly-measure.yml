name: Weekly Measure

on:
  schedule:
    - cron: '0 3 * * MON'   # 매주 월요일 03:00 UTC (KST 12:00)
  workflow_dispatch:
    inputs:
      mode:
        description: "측정 모드"
        type: choice
        options: [live, mock]
        default: live

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run measurement
        env:
          AEO_MODE: ${{ github.event.inputs.mode || 'live' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: uv run python -m src.measure.run_all

      - name: Generate report
        run: |
          uv run python -m src.report.weekly_report
          uv run python -m src.report.baseline_report

      - name: Commit results
        run: |
          git config user.name "aeo-bot"
          git config user.email "aeo-bot@users.noreply.github.com"
          git add data/results reports/
          git diff --cached --quiet || git commit -m "chore(measure): weekly report $(date +%Y-%m-%d)"
          git push
