# 측정 채널 목록. 채널 = provider + model + 검색 on/off 조합.
# 현재는 OpenAI 키만 보유 → ChatGPT 채널만 활성화.
# 다른 provider 키가 생기면 아래 주석을 해제하면 된다.
llms:
  - id: gpt5_search
    provider: openai
    model: gpt-5
    use_search: true
  - id: gpt5_no_search
    provider: openai
    model: gpt-5
    use_search: false
