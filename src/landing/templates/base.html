<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>
  <meta name="description" content="{% block description %}{% endblock %}">
  {% block meta %}{% endblock %}
  {% block jsonld %}{% endblock %}
  <style>
    :root { --accent: #b4552d; --bg: #faf7f2; --ink: #2b2620; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
           background: var(--bg); color: var(--ink); line-height: 1.65; }
    main { max-width: 720px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    h1 { font-size: 2rem; margin-bottom: .25rem; }
    h2 { border-bottom: 2px solid var(--accent); padding-bottom: .3rem; margin-top: 2.5rem; }
    .badge { display: inline-block; background: var(--accent); color: #fff;
             border-radius: 999px; padding: .15rem .7rem; font-size: .85rem; }
    dl { display: grid; grid-template-columns: 6rem 1fr; gap: .4rem .8rem; }
    dt { font-weight: 700; }
    dd { margin: 0; }
    blockquote { background: #fff; border-left: 4px solid var(--accent);
                 margin: .8rem 0; padding: .7rem 1rem; border-radius: 0 .5rem .5rem 0; }
    blockquote footer { font-size: .85rem; color: #7a7267; margin-top: .3rem; }
    footer.page { text-align: center; color: #9a9186; font-size: .8rem; padding: 2rem 0; }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="page">{% block footer %}{% endblock %}</footer>
</body>
</html>
